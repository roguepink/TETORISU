<script>
/* ---- js/util.js ---- */
'use strict';
// ===== 共通ユーティリティ =====
const W = 960, H = 540;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function weightedPick(list, rng = Math.random) {
  let total = 0; for (const it of list) total += it.w;
  let r = rng() * total;
  for (const it of list) { r -= it.w; if (r <= 0) return it; }
  return list[list.length - 1];
}

function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const f = (c) => { c = amt > 0 ? c + (255 - c) * amt : c * (1 + amt); return Math.round(clamp(c, 0, 255)); };
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function hsl(h, s, l, a = 1) { return `hsla(${h},${s}%,${l}%,${a})`; }

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

const FONT = "'M PLUS Rounded 1c','Rounded Mplus 1c','Hiragino Maru Gothic ProN','Yu Gothic UI','Meiryo','IPAPGothic','Noto Sans CJK JP',sans-serif";
function drawText(ctx, text, x, y, size, color = '#fff', align = 'center', opts = {}) {
  ctx.save();
  ctx.font = `${opts.weight || 'bold'} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = opts.baseline || 'middle';
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  if (opts.shadow) { ctx.shadowColor = opts.shadow; ctx.shadowBlur = opts.shadowBlur || 12; }
  if (opts.outline) { ctx.lineJoin = 'round'; ctx.lineWidth = opts.outlineWidth || Math.max(3, size * 0.16); ctx.strokeStyle = opts.outline; ctx.strokeText(text, x, y); }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.restore();
}

// ===== テトロミノ定義 =====
const SHAPES = {
  I: [[0, 0], [1, 0], [2, 0], [3, 0]],
  O: [[0, 0], [1, 0], [0, 1], [1, 1]],
  T: [[0, 0], [1, 0], [2, 0], [1, 1]],
  S: [[1, 0], [2, 0], [0, 1], [1, 1]],
  Z: [[0, 0], [1, 0], [1, 1], [2, 1]],
  J: [[0, 0], [0, 1], [1, 1], [2, 1]],
  L: [[2, 0], [0, 1], [1, 1], [2, 1]],
  M: [[0, 0]],
  P: [[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]],
  D: [[0, 0], [1, 0]],
};
const TETROMINO_KEYS = ['I', 'O', 'T', 'S', 'Z', 'J', 'L'];
const MINO_COLORS = { I: '#4DEBF5', O: '#F5D542', T: '#B86BF0', S: '#5BE06A', Z: '#F25C6E', J: '#4F7BF5', L: '#F5944D', M: '#F58BC9', P: '#6FE8D2', D: '#FFFFFF' };

const _boundsCache = new Map();
function shapeBounds(cells) {
  let b = _boundsCache.get(cells);
  if (b) return b;
  let minx = 99, miny = 99, maxx = -99, maxy = -99;
  for (const [x, y] of cells) { minx = Math.min(minx, x); maxx = Math.max(maxx, x); miny = Math.min(miny, y); maxy = Math.max(maxy, y); }
  b = { minx, miny, maxx, maxy, w: maxx - minx + 1, h: maxy - miny + 1, cx: (minx + maxx + 1) / 2, cy: (miny + maxy + 1) / 2 };
  _boundsCache.set(cells, b);
  return b;
}
function shapeRadius(cells, size) { const b = shapeBounds(cells); return Math.max(b.w, b.h) * size * 0.5; }

// ベベル付きのミノを (x,y) 中心に描く
function drawMino(ctx, x, y, cells, size, color, rot = 0, alpha = 1, glow = false) {
  const b = shapeBounds(cells);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  if (alpha !== 1) ctx.globalAlpha = alpha;
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = size * 1.2; }
  const light = shade(color, 0.5), dark = shade(color, -0.38);
  const bev = Math.max(1.5, size * 0.18);
  for (const [cx, cy] of cells) {
    const px = (cx - b.cx) * size, py = (cy - b.cy) * size;
    ctx.fillStyle = color; ctx.fillRect(px, py, size, size);
    ctx.fillStyle = light; ctx.fillRect(px, py, size, bev); ctx.fillRect(px, py, bev, size);
    ctx.fillStyle = dark; ctx.fillRect(px, py + size - bev, size, bev); ctx.fillRect(px + size - bev, py, bev, size);
    if (size >= 14) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(px + bev * 1.5, py + bev * 1.5, size * 0.22, size * 0.22); }
  }
  ctx.restore();
}

// 背景用：輪郭だけの半透明ミノ
function drawMinoGhost(ctx, x, y, cells, size, color, rot = 0, alpha = 0.35) {
  const b = shapeBounds(cells);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha = alpha;
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(1.5, size * 0.08); ctx.shadowColor = color; ctx.shadowBlur = size * 0.5;
  ctx.fillStyle = rgba(color, 0.18);
  for (const [cx, cy] of cells) { const px = (cx - b.cx) * size, py = (cy - b.cy) * size; ctx.fillRect(px + 2, py + 2, size - 4, size - 4); ctx.strokeRect(px + 2, py + 2, size - 4, size - 4); }
  ctx.restore();
}

// ===== ぷよカラー =====
const PUYO_COLORS = [
  { name: 'あか', main: '#FF5E7A', dark: '#C83050', light: '#FFC2CF', eye: 'round' },
  { name: 'みどり', main: '#5BE06A', dark: '#2E9E3C', light: '#C8F7CC', eye: 'sleepy' },
  { name: 'あお', main: '#4FA3FF', dark: '#2360C0', light: '#C4E0FF', eye: 'droopy' },
  { name: 'きいろ', main: '#FFD84D', dark: '#C99A10', light: '#FFF2B8', eye: 'star' },
  { name: 'むらさき', main: '#B96BFF', dark: '#7A36C8', light: '#E6CCFF', eye: 'cat' },
];
const OJAMA_COLOR = { name: 'おじゃま', main: '#9AA0B0', dark: '#5C6270', light: '#E0E3EA', eye: 'dot' };
function rainbowColor(t, l = 62) { return hsl((t * 120) % 360, 90, l); }
function puyoColor(idx, t = 0) {
  if (idx === -1) return OJAMA_COLOR;
  if (idx === 5) return { name: 'レインボー', main: rainbowColor(t), dark: hsl((t * 120) % 360, 80, 40), light: hsl((t * 120) % 360, 90, 88), eye: 'round' };
  return PUYO_COLORS[idx];
}

/* ---- js/audio.js ---- */
'use strict';
// ===== サウンド（WebAudio 合成：効果音 + ステージ BGM） =====
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, bgmBus = null, noiseBuf = null;
  let muted = false;
  let lastShoot = 0, lastPop = 0;

  function ensure() {
    if (ctx) return true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
      bgmBus = ctx.createGain(); bgmBus.gain.value = 0.32; bgmBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { return false; }
    return true;
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function now() { return ctx ? ctx.currentTime : 0; }

  function tone(o) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(Math.max(1, o.freq), t0);
    if (o.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqEnd), t0 + o.dur);
    const g = ctx.createGain();
    const vol = o.vol === undefined ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (o.attack || 0.005));
    if (o.hold) g.gain.setValueAtTime(vol, t0 + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    osc.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t0); osc.stop(t0 + o.dur + 0.03);
  }
  function noise(o) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.filter || 'lowpass';
    f.frequency.setValueAtTime(o.freq || 1000, t0);
    if (o.freqEnd) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.freqEnd), t0 + o.dur);
    f.Q.value = o.q || 1;
    const g = ctx.createGain();
    const vol = o.vol === undefined ? 0.2 : o.vol;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + (o.attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
    src.connect(f); f.connect(g); g.connect(o.bus || sfxBus);
    src.start(t0); src.stop(t0 + o.dur + 0.03);
  }

  const sfx = {
    shoot(idx = 0) {
      const t = performance.now(); if (t - lastShoot < 45) return; lastShoot = t;
      const base = [760, 320, 620, 540, 480, 700, 580, 900, 420, 660][idx % 10];
      tone({ type: idx === 1 ? 'triangle' : 'square', freq: base, freqEnd: base * 0.55, dur: 0.07, vol: 0.06 });
    },
    pop(chain = 0) {
      const t = performance.now(); if (t - lastPop < 25 && chain === 0) return; lastPop = t;
      const f = 420 * Math.pow(1.12, Math.min(chain, 14));
      tone({ type: 'sine', freq: f, freqEnd: f * 2.2, dur: 0.12, vol: 0.22 });
      noise({ filter: 'bandpass', freq: 1800 + chain * 150, freqEnd: 3500, q: 2, dur: 0.08, vol: 0.12 });
      if (chain >= 2) tone({ type: 'triangle', freq: f * 1.5, freqEnd: f * 3, dur: 0.16, vol: 0.12, delay: 0.03 });
    },
    optionShot() { const t = performance.now(); if (t - lastShoot < 40) return; tone({ type: 'sine', freq: 1200, freqEnd: 700, dur: 0.06, vol: 0.04 }); },
    hit() { tone({ type: 'square', freq: 220, freqEnd: 180, dur: 0.03, vol: 0.03 }); },
    explode(size = 1) {
      noise({ freq: 900 * size, freqEnd: 80, dur: 0.35 + 0.2 * size, vol: 0.3 });
      tone({ type: 'sine', freq: 140, freqEnd: 35, dur: 0.4, vol: 0.3 });
    },
    item() { [660, 880, 1320].forEach((f, i) => tone({ type: 'triangle', freq: f, dur: 0.12, vol: 0.16, delay: i * 0.06 })); },
    powerup() { [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'square', freq: f, dur: 0.14, vol: 0.12, delay: i * 0.07 })); },
    weapon() { [392, 523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', freq: f, dur: 0.16, vol: 0.14, delay: i * 0.05 })); },
    heal() { [784, 988, 1175].forEach((f, i) => tone({ type: 'sine', freq: f, dur: 0.2, vol: 0.14, delay: i * 0.08 })); },
    hurt() { tone({ type: 'sawtooth', freq: 220, freqEnd: 50, dur: 0.3, vol: 0.25 }); noise({ freq: 2000, freqEnd: 200, dur: 0.25, vol: 0.2 }); },
    shieldHit() { tone({ type: 'triangle', freq: 900, freqEnd: 400, dur: 0.15, vol: 0.2 }); },
    death() {
      noise({ freq: 3000, freqEnd: 60, dur: 1.0, vol: 0.4 });
      [440, 392, 330, 262].forEach((f, i) => tone({ type: 'square', freq: f, freqEnd: f * 0.5, dur: 0.3, vol: 0.15, delay: i * 0.15 }));
    },
    bomb() {
      noise({ freq: 400, freqEnd: 40, dur: 1.2, vol: 0.4 });
      tone({ type: 'sawtooth', freq: 60, freqEnd: 20, dur: 1.0, vol: 0.35 });
      [523, 659, 784, 1046, 1318].forEach((f, i) => tone({ type: 'square', freq: f, dur: 0.18, vol: 0.14, delay: 0.5 + i * 0.07 }));
    },
    charge(level) { tone({ type: 'sine', freq: 300 + level * 500, freqEnd: 350 + level * 500, dur: 0.06, vol: 0.05 }); },
    chargeReady() { [880, 1320, 1760].forEach((f, i) => tone({ type: 'sine', freq: f, dur: 0.1, vol: 0.12, delay: i * 0.04 })); },
    chargeShot() { tone({ type: 'sawtooth', freq: 90, freqEnd: 500, dur: 0.4, vol: 0.3 }); noise({ freq: 600, freqEnd: 3000, dur: 0.3, vol: 0.15, filter: 'bandpass' }); },
    bounce() { tone({ type: 'square', freq: 1200, freqEnd: 1800, dur: 0.05, vol: 0.05 }); },
    warning() { for (let i = 0; i < 3; i++) { tone({ type: 'square', freq: 520, dur: 0.25, vol: 0.14, delay: i * 0.55 }); tone({ type: 'square', freq: 390, dur: 0.25, vol: 0.14, delay: i * 0.55 + 0.27 }); } },
    bossHit() { tone({ type: 'square', freq: 160, freqEnd: 120, dur: 0.05, vol: 0.05 }); },
    bossDie() {

    },
    clear() { [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone({ type: 'square', freq: f, dur: i === 6 ? 0.6 : 0.16, vol: 0.14, delay: i * 0.13 })); },
    select() { tone({ type: 'square', freq: 880, freqEnd: 1100, dur: 0.06, vol: 0.1 }); },
    start() { [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', freq: f, dur: 0.2, vol: 0.16, delay: i * 0.08 })); },
    fever() { [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone({ type: 'sawtooth', freq: f, dur: 0.14, vol: 0.12, delay: i * 0.06 })); },
    oneup() { [659, 784, 1318, 1046, 1175, 1568].forEach((f, i) => tone({ type: 'square', freq: f, dur: 0.14, vol: 0.14, delay: i * 0.09 })); },
    chainText(n) { tone({ type: 'triangle', freq: 600 + n * 90, freqEnd: 900 + n * 120, dur: 0.15, vol: 0.14 }); },
    enemyShot() { tone({ type: 'sine', freq: 500, freqEnd: 300, dur: 0.05, vol: 0.04 }); },
    switchWeapon() { tone({ type: 'square', freq: 700, freqEnd: 1000, dur: 0.07, vol: 0.08 }); tone({ type: 'square', freq: 1000, freqEnd: 1300, dur: 0.07, vol: 0.08, delay: 0.06 }); },
  };

  // ===== BGM シーケンサー =====

  const SONGS = {
    title: { bpm: 104, root: 60, scale: MAJOR, lead: 'triangle', bass: 'triangle', seed: 7, drums: false, chords: [0, 3, 5, 4], arp: true },
    stage: [
      { bpm: 132, root: 60, scale: MAJOR, lead: 'square', bass: 'triangle', seed: 11, drums: true, chords: [0, 5, 3, 4], arp: false },
      { bpm: 122, root: 62, scale: PENTA, lead: 'triangle', bass: 'sine', seed: 23, drums: true, chords: [0, 3, 4, 3], arp: true },
      { bpm: 144, root: 57, scale: MINOR, lead: 'sawtooth', bass: 'square', seed: 37, drums: true, chords: [0, 5, 2, 4], arp: true },
      { bpm: 112, root: 55, scale: DORIAN, lead: 'sine', bass: 'triangle', seed: 41, drums: true, chords: [0, 2, 3, 6], arp: false },
      { bpm: 156, root: 52, scale: PHRYG, lead: 'square', bass: 'sawtooth', seed: 59, drums: true, chords: [0, 1, 0, 4], arp: true },
      { bpm: 118, root: 64, scale: [0, 2, 4, 7, 9], lead: 'triangle', bass: 'triangle', seed: 71, drums: true, chords: [0, 4, 5, 3], arp: true },
      { bpm: 148, root: 55, scale: MINOR, lead: 'sawtooth', bass: 'square', seed: 83, drums: true, chords: [0, 3, 5, 4], arp: false },
      { bpm: 108, root: 67, scale: MAJOR, lead: 'sine', bass: 'triangle', seed: 97, drums: true, chords: [0, 5, 3, 4], arp: true },
    ],
    boss: [
      { bpm: 150, root: 57, scale: MINOR, lead: 'square', bass: 'sawtooth', seed: 101, drums: true, chords: [0, 0, 5, 4], arp: true },

// ===== パーティクル / 浮遊テキスト / エフェクト =====
class Particles {

  }

    const l = this.list; let w = 0;

          this.vy = -this.vy; this.bounces--; this.vx *= 1.1; this.vy *= 1.1; this.dmg += 1; this.hits.clear();
          fxSparkle(g.particles, this.x, this.y, this.color, 5); Sound.sfx.bounce();
          if (this.bounces < 0) this.dead = true;
        }
        break;
      case 'homing': {
        const e = g.nearestEnemy(this.x, this.y, 520, this.hits);
        let ang = Math.atan2(this.vy, this.vx);
        if (e) {
          const want = Math.atan2(e.y - this.y, e.x - this.x);
          let d = want - ang; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
          ang += clamp(d, -this.turn * dt, this.turn * dt);
        } else { // 敵がいなければ徐々に前へ
          let d = -ang; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
          ang += clamp(d, -2 * dt, 2 * dt);
        }
        this.vx = Math.cos(ang) * this.speed; this.vy = Math.sin(ang) * this.speed;
        this.x += this.vx * dt; this.y += this.vy * dt; this.rot = ang;
        if (this.cute) { if (Math.random() < 0.7) g.particles.add({ type: 'star', x: this.x - 6, y: this.y + rand(-3, 3), vx: -60, vy: rand(-20, 20), size: rand(2.5, 4.5), color: Math.random() < 0.5 ? '#fff' : this.color, life: 0.35, shrink: true, vr: 6 }); }
        else if (Math.random() < 0.5) g.particles.add({ type: 'circle', x: this.x, y: this.y, size: 3, color: this.color, life: 0.25, shrink: true, alpha: 0.6 });
        break;
      }
      case 'split':
        this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.vr * dt;
        if (this.age > this.splitTime) { this.split(g); this.dead = true; }
        break;
      case 'rain':
        this.vy += this.gravity * dt; this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.vr * dt;
        if (this.y > H + 40) this.dead = true;
        break;
      case 'spin':
        this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.vr * dt;
        if (this.big && Math.random() < 0.6) g.particles.add({ type: 'cell', x: this.x + rand(-this.r, this.r), y: this.y + rand(-this.r, this.r), vx: -200, size: rand(4, 8), color: this.color, life: 0.4, shrink: true, vr: 5 });
        break;
      default:
        this.x += this.vx * dt; this.y += this.vy * dt; this.rot += this.vr * dt;
    }
    if (this.x > W + 60 || this.x < -80 || this.y < -80 || this.y > H + 80) this.dead = true;
  }
  split(g) {
    const n = this.frags, col = this.color;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-0.2, 0.2), sp = 520;
      g.addBullet(new Bullet({ x: this.x, y: this.y, vx: Math.cos(a) * sp + 150, vy: Math.sin(a) * sp, dmg: this.fragDmg, size: 7, shape: SHAPES.M, color: col, pierce: 1, vr: 12, life: 0.7 }));
    }
    fxMinoBurst(g.particles, this.x, this.y, col, 5);
  }
  // 敵にヒットしたとき。true を返したら弾は消える
  onHit(e, g) {
    if (this.kind === 'spin') {
      const last = this.hits.get(e.id);
      if (last !== undefined && this.age - last < this.tick) return false;
      this.hits.set(e.id, this.age);
      e.takeDamage(this.dmg, g, this);
      g.particles.add({ type: 'ring', x: e.x, y: e.y, size: e.r * 1.3, color: this.color, life: 0.2, lw: 3 });
      return false;
    }
    if (this.hits.has(e.id)) return false;
    this.hits.add(e.id);
    e.takeDamage(this.dmg, g, this);
    fxSparkle(g.particles, this.x, this.y, this.color, 3);
    if (this.kind === 'heavy') {
      g.areaDamage(this.x, this.y, this.blast, this.dmg * 0.6, { exclude: e.id, source: this });
      fxExplosion(g.particles, this.x, this.y, this.blast * 0.7, this.color);
      Sound.sfx.explode(0.6); g.shake(4);
      return true;
    }
    if (this.kind === 'split') { this.split(g); return true; }
    if (this.pierce > 0) { this.pierce--; return false; }
    return true;
  }
  draw(ctx) {
    const col = this.rainbow ? rainbowColor(this.age * 3 + this.id * 0.3) : this.color;
    if (this.cute) { // お供ミノのハート型ミサイル
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rot + Math.PI / 2); ctx.shadowColor = col; ctx.shadowBlur = 8;
      drawHeart(ctx, 0, 0, this.size * 0.75, col); ctx.restore(); return;
    }
    if (this.big) {
      ctx.save(); ctx.globalAlpha = 0.35; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 1.1, 0, TAU); ctx.fill(); ctx.restore();
    }
    drawMino(ctx, this.x, this.y, this.shape, this.size, col, this.rot, 1, this.glow);
  }
}

// draw(ctx, x, y, t) はアイコンの描画、apply(g, p) は取得効果
function drawHeart(ctx, x, y, s, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.3);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.beginPath(); ctx.arc(x - s * 0.45, y - s * 0.35, s * 0.22, 0, TAU); ctx.fill();
}
function drawStar(ctx, x, y, r, color, rot = 0) {
  ctx.fillStyle = color; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function iconLetter(ctx, x, y, letter, color, bg = '#fff') {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
  drawText(ctx, letter, x, y + 1, 15, color);
}

function randomItemKey(g) {
  const list = ITEM_KEYS.map((k) => ({ k, w: ITEMS[k].w }));
  const p = g.player;
  // 状況に応じた重み調整
  for (const it of list) {
    if (it.k === 'heal' || it.k === 'healBig') it.w *= p.hp < p.maxHp * 0.5 ? 1.8 : 0.8;
    if (it.k === 'option' && p.options >= 4) it.w = 0.3;
    if (it.k === 'rear' && p.rear) it.w = 0.3;
    if (it.k === 'missile' && p.missiles) it.w = 0.3;
    if (it.k === 'speed' && p.speedLv >= 5) it.w = 0.3;
    if (it.k === 'shield' && p.shield > 0) it.w *= 0.4;
  }
  return weightedPick(list).k;
}

class Item {
  constructor(key, x, y) {
    this.key = key; this.def = ITEMS[key]; this.x = x; this.y = y; this.t = rand(10); this.life = 14; this.dead = false;
    this.vx = rand(-60, -30); this.vy = rand(-80, 80); this.r = 18;
  }
  update(dt, g) {
    this.t += dt; this.life -= dt;
    const p = g.player;
    if (p.timers.magnet > 0 && p.alive) {
      const d = dist(this.x, this.y, p.x, p.y);
      if (d < 420) { const k = (1 - d / 420) * 900; this.vx += (p.x - this.x) / d * k * dt; this.vy += (p.y - this.y) / d * k * dt; }
    } else { this.vx += (-45 - this.vx) * dt; this.vy *= 1 - 1.5 * dt; }
    this.x += this.vx * dt; this.y += this.vy * dt + Math.sin(this.t * 3) * 14 * dt;
    if (this.y < 50) this.vy += 100 * dt; if (this.y > H - 20) this.vy -= 100 * dt;
    if (this.x < -40 || this.life <= 0) this.dead = true;
  }
  draw(ctx) {
    if (this.life < 3 && Math.floor(this.life * 8) % 2 === 0) return;
    const bob = Math.sin(this.t * 3) * 3;
    ctx.save(); ctx.translate(this.x, this.y + bob);
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(0, 0, 19, 0, TAU); ctx.fill();
    ctx.strokeStyle = this.def.color; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = rgba(this.def.color === '#fff' || this.def.color === '#FFFFFF' ? '#FFD0FF' : this.def.color, 0.18); ctx.fill();
    this.def.draw(ctx, 0, 0, this.t);
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(-8, -9, 4, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

let _enemyId = 0;

class EBullet {
  constructor(x, y, vx, vy, o = {}) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.kind = o.kind || 'ball'; this.r = o.r || (this.kind === 'big' ? 12 : this.kind === 'needle' ? 5 : 7);
    this.color = o.color === undefined ? 0 : o.color; this.life = o.life || 8; this.age = 0; this.dead = false;
    this.homing = o.homing || 0; this.accel = o.accel || 0;
    this.bounces = o.bounces || 0; this.grav = o.grav || 0; this.amp = o.amp || 0; this.freq = o.freq || 6; this.wt = 0;
  }
  update(dt, g) {
    this.age += dt;
    if (this.homing && g.player.alive) {
      const p = g.player, a = Math.atan2(this.vy, this.vx), want = Math.atan2(p.y - this.y, p.x - this.x);
      let d = want - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      const na = a + clamp(d, -this.homing * dt, this.homing * dt), sp = Math.hypot(this.vx, this.vy);
      this.vx = Math.cos(na) * sp; this.vy = Math.sin(na) * sp;
    }
    if (this.accel) { const sp = Math.hypot(this.vx, this.vy) || 1, ns = sp + this.accel * dt; this.vx *= ns / sp; this.vy *= ns / sp; }
    if (this.grav) this.vy += this.grav * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.amp) { this.wt += dt; this.y += Math.cos(this.wt * this.freq) * this.amp * this.freq * dt; }
    if (this.bounces > 0) {
      if (this.y < 46 + this.r && this.vy < 0) { this.y = 46 + this.r; this.vy = -this.vy; this.bounces--; }
      else if (this.y > H - this.r && this.vy > 0) { this.y = H - this.r; this.vy = -this.vy; this.bounces--; }
    }
    if (this.age > this.life || this.x < -60 || this.x > W + 80 || this.y < -60 || this.y > H + 60) this.dead = true;
  }
  draw(ctx, t) {
    const col = puyoColor(this.color, t);
    ctx.save(); ctx.translate(this.x, this.y);
    if (this.kind === 'needle') ctx.rotate(Math.atan2(this.vy, this.vx));
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath();
    if (this.kind === 'needle') ctx.ellipse(0, 0, this.r * 2.9, this.r * 1.35, 0, 0, TAU); else ctx.arc(0, 0, this.r + 3, 0, TAU);
    ctx.fill();
    ctx.fillStyle = col.dark; ctx.beginPath();
    if (this.kind === 'needle') ctx.ellipse(0, 0, this.r * 2.6, this.r, 0, 0, TAU); else ctx.arc(0, 0, this.r + 1.5, 0, TAU);
    ctx.fill();
    ctx.fillStyle = col.main; ctx.beginPath();
    if (this.kind === 'needle') ctx.ellipse(0, 0, this.r * 2.2, this.r * 0.7, 0, 0, TAU); else ctx.arc(0, 0, this.r, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.arc(-this.r * 0.35, -this.r * 0.35, this.r * 0.32, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

// ぷよの描画
function drawPuyo(ctx, x, y, r, col, o = {}) {
  const t = o.t || 0;
  const wob = 1 + Math.sin(t * 5 + (o.phase || 0)) * 0.03;
  const sx = (o.sx || 1) * wob * (1 + (o.squash || 0)), sy = (o.sy || 1) / wob * (1 - (o.squash || 0) * 0.6);
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  if (o.marked) { const k = 1 + Math.sin(t * 30) * 0.08; ctx.scale(k, k); }
  if (o.glow) { ctx.shadowColor = col.main; ctx.shadowBlur = o.glow; }
  // 本体
  const grad = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05);
  grad.addColorStop(0, col.light); grad.addColorStop(0.45, col.main); grad.addColorStop(1, col.dark);
  ctx.fillStyle = grad;
  ctx.beginPath();
  // 少しだけ下が広い丸（ぷよっぽさ）
  ctx.moveTo(0, -r);
  ctx.bezierCurveTo(r * 0.95, -r, r * 1.08, r * 0.3, r * 0.85, r * 0.75);
  ctx.bezierCurveTo(r * 0.5, r * 1.05, -r * 0.5, r * 1.05, -r * 0.85, r * 0.75);
  ctx.bezierCurveTo(-r * 1.08, r * 0.3, -r * 0.95, -r, 0, -r);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = Math.max(1.5, r * 0.09); ctx.strokeStyle = o.marked ? '#fff' : col.dark; ctx.stroke();
  ctx.shadowBlur = 0;
  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.5, r * 0.22, r * 0.14, -0.6, 0, TAU); ctx.fill();
  // 目
  if (!o.noFace) {
    const ex = r * 0.34, ey = -r * 0.08, er = r * 0.26;
    const dx = (o.eyeDir ? o.eyeDir.x : -0.4) * er * 0.4, dy = (o.eyeDir ? o.eyeDir.y : 0) * er * 0.4;
    const style = col.eye || 'round';
    for (const s of [-1, 1]) {
      const cx = s * ex, cy = ey;
      if (o.blink || o.dizzy) {
        ctx.strokeStyle = col.dark; ctx.lineWidth = Math.max(2, r * 0.09); ctx.lineCap = 'round';
        if (o.dizzy) { ctx.beginPath(); ctx.moveTo(cx - er * 0.6, cy - er * 0.6); ctx.lineTo(cx + er * 0.6, cy + er * 0.6); ctx.moveTo(cx + er * 0.6, cy - er * 0.6); ctx.lineTo(cx - er * 0.6, cy + er * 0.6); ctx.stroke(); }
        else { ctx.beginPath(); ctx.moveTo(cx - er * 0.7, cy); ctx.lineTo(cx + er * 0.7, cy); ctx.stroke(); }
        continue;
      }
      ctx.fillStyle = '#fff'; ctx.beginPath();
      if (style === 'droopy') ctx.ellipse(cx, cy + r * 0.06, er, er * 0.8, s * 0.3, 0, TAU);
      else if (style === 'dot') ctx.arc(cx, cy, er * 0.55, 0, TAU);
      else ctx.ellipse(cx, cy, er * 0.85, er, 0, 0, TAU);
      ctx.fill();
      // 瞳
      ctx.fillStyle = '#2A1838';
      if (style === 'star') {
        drawStar(ctx, cx + dx, cy + dy, er * 0.55, '#2A1838', t * 2);
      } else if (style === 'cat') {
        ctx.beginPath(); ctx.ellipse(cx + dx, cy + dy, er * 0.22, er * 0.7, 0, 0, TAU); ctx.fill();
      } else if (style === 'dot') {
        ctx.beginPath(); ctx.arc(cx + dx * 0.5, cy + dy * 0.5, er * 0.3, 0, TAU); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(cx + dx, cy + dy, er * 0.5, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + dx - er * 0.18, cy + dy - er * 0.22, er * 0.16, 0, TAU); ctx.fill();
      // まぶた（眠そう）
      if (style === 'sleepy') { ctx.fillStyle = col.main; ctx.beginPath(); ctx.ellipse(cx, cy - er * 0.5, er * 0.95, er * 0.5, 0, 0, TAU); ctx.fill(); }
      // 怒り眉
      if (o.angry) { ctx.strokeStyle = col.dark; ctx.lineWidth = Math.max(2, r * 0.08); ctx.beginPath(); ctx.moveTo(cx - s * er * 0.9, cy - er * 1.15); ctx.lineTo(cx + s * er * 0.6, cy - er * 0.75); ctx.stroke(); }
    }
    // 口
    ctx.strokeStyle = col.dark; ctx.lineWidth = Math.max(1.5, r * 0.07); ctx.lineCap = 'round'; ctx.beginPath();
    if (o.angry) ctx.arc(0, r * 0.55, r * 0.18, Math.PI * 1.15, Math.PI * 1.85);
    else if (o.dizzy) ctx.arc(0, r * 0.45, r * 0.12, 0, TAU);
    else ctx.arc(0, r * 0.3, r * 0.2, Math.PI * 0.15, Math.PI * 0.85);
    ctx.stroke();
    // ほっぺ
    ctx.fillStyle = 'rgba(255,120,150,0.35)';
    ctx.beginPath(); ctx.ellipse(-r * 0.62, r * 0.22, r * 0.16, r * 0.1, 0, 0, TAU); ctx.ellipse(r * 0.62, r * 0.22, r * 0.16, r * 0.1, 0, 0, TAU); ctx.fill();
  }
  if (o.flash > 0) { ctx.globalAlpha = Math.min(1, o.flash * 6); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, r * 1.02, 0, TAU); ctx.fill(); }
  ctx.restore();
}

      ctx.strokeStyle = '#3E8E41'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x, this.top ? 36 : H + 6); ctx.stroke();
      ctx.fillStyle = '#5BE06A'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(this.x + s * 12, this.top ? 48 : H - 10, 9, 5, s * 0.5, 0, TAU); ctx.fill(); }
    }
    if (this.type === 'ambusher' && this.x < 30) { // 背後からの予告
      const a = 0.5 + Math.sin(g.time * 18) * 0.5; ctx.fillStyle = `rgba(255,80,110,${0.4 + a * 0.6})`; ctx.beginPath(); ctx.moveTo(8, this.y - 14); ctx.lineTo(30, this.y); ctx.lineTo(8, this.y + 14); ctx.closePath(); ctx.fill();
      drawText(ctx, '!', 44, this.y, 22, '#FF5E7A', 'center', { outline: '#fff' });
    }
    const o = { t: this.t, phase: this.phase, eyeDir: this.eyeDir, blink: this.blink, flash: this.hitFlash, squash: this.squash, marked: this.popTimer >= 0, angry: this.angry || (this.type === 'ojama') };
    if (this.color === 5) o.glow = 14;
    drawPuyo(ctx, this.x, this.y, this.r, col, o);
    drawAccessory(ctx, this, col);
    if (this.type === 'mine') { // 導火線
      ctx.strokeStyle = '#5C3A2E'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(this.x, this.y - this.r); ctx.quadraticCurveTo(this.x + 6, this.y - this.r - 14, this.x + 14, this.y - this.r - 12); ctx.stroke();
      const k = 0.5 + Math.sin(this.t * 20) * 0.5; ctx.fillStyle = this.fuse > 0 ? '#FF5E3A' : '#FFD84D'; ctx.beginPath(); ctx.arc(this.x + 14, this.y - this.r - 12, 3 + k * 2 + this.fuse * 6, 0, TAU); ctx.fill();
      if (this.fuse > 0) drawText(ctx, '!', this.x, this.y - this.r - 28, 20, '#FF5E3A', 'center', { outline: '#fff' });
    }
    if (this.type === 'ojama') { // とげとげ帽子
      ctx.fillStyle = '#6C7384'; ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI * 0.8 + i * 0.3; ctx.moveTo(this.x + Math.cos(a) * this.r * 0.9, this.y + Math.sin(a) * this.r * 0.9); ctx.lineTo(this.x + Math.cos(a + 0.15) * this.r * 1.35, this.y + Math.sin(a + 0.15) * this.r * 1.35); ctx.lineTo(this.x + Math.cos(a + 0.3) * this.r * 0.9, this.y + Math.sin(a + 0.3) * this.r * 0.9); } ctx.fill();
    }
    if (this.type === 'big' || this.type === 'shooter') { // HP バー
      const w = this.r * 1.6, k = clamp(this.hp / this.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(this.x - w / 2, this.y - this.r - 10, w, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(this.x - w / 2, this.y - this.r - 10, w * k, 4);
    }
  }
}

const ATK = {
  wait: (dur) => ({ dur, tick() {} }),
  aimed: (n, interval, speed, spread = 0.2, dur = 3) => ({ dur, start(b) { b.acc = interval * 0.5; }, tick(b, dt, g) { b.acc += dt; if (b.acc >= interval) { b.acc -= interval; b.shootAimed(g, speed, n, spread); } } }),
  ring: (n, speed, times = 3, interval = 0.8, kind) => ({ dur: times * interval + 0.4, start(b) { b.acc = interval * 0.6; b.cnt = 0; }, tick(b, dt, g) { b.acc += dt; if (b.acc >= interval && b.cnt < times) { b.acc -= interval; b.cnt++; b.shootRing(g, n, speed, b.cnt * 0.33 + b.t, { kind }); b.squash = 0.3; } } }),
  spiral: (dur, rate, speed, turn, arms = 2) => ({ dur, start(b) { b.acc = 0; b.sang = 0; }, tick(b, dt, g) { b.acc += dt; while (b.acc >= rate) { b.acc -= rate; b.sang += turn; for (let i = 0; i < arms; i++) b.shoot(g, b.sang + (i / arms) * TAU, speed); } } }),
  homingBurst: (n, speed, times = 2, interval = 1.2) => ({ dur: times * interval + 0.6, start(b) { b.acc = interval * 0.5; b.cnt = 0; }, tick(b, dt, g) { b.acc += dt; if (b.acc >= interval && b.cnt < times) { b.acc -= interval; b.cnt++; for (let i = 0; i < n; i++) b.shoot(g, Math.PI + (i - (n - 1) / 2) * 0.35, speed, { kind: 'big', homing: 1.3, life: 5 }); Sound.sfx.enemyShot(); } } }),
  curtain: (speed = 260, times = 3, interval = 1.3, gapH = 110) => ({ dur: times * interval + 0.6, start(b) { b.acc = interval * 0.5; b.cnt = 0; }, tick(b, dt, g) { b.acc += dt; if (b.acc >= interval && b.cnt < times) { b.acc -= interval; b.cnt++; const gapY = g.player.y + rand(-30, 30); for (let y = 60; y < H; y += 34) if (Math.abs(y - gapY) > gapH / 2) g.addEBullet(new EBullet(b.x - b.r, y, -speed * g.diff.bspeed, 0, { color: b.color })); Sound.sfx.enemyShot(); b.squash = 0.3; } } }),
  rainNeedles: (dur = 3, rate = 0.12, speed = 380) => ({ dur, start(b) { b.acc = 0; }, tick(b, dt, g) { b.acc += dt; while (b.acc >= rate) { b.acc -= rate; g.addEBullet(new EBullet(rand(60, W - 40), -10, rand(-70, -20), speed * g.diff.bspeed, { color: b.color, kind: 'needle' })); } } }),
  sweep: (dur = 2.6, rate = 0.05, speed = 420) => ({ dur, start(b) { b.acc = 0; }, tick(b, dt, g, t) { b.acc += dt; while (b.acc >= rate) { b.acc -= rate; const a = Math.PI + Math.sin(t * 2.4) * 0.75; b.shoot(g, a, speed, { kind: 'needle' }); } } }),
  dash: (speed = 700) => ({
    dur: 3.4, noMove: true, start(b) { b.dstate = 0; },
    tick(b, dt, g, t) {
      if (b.dstate === 0) { b.y += clamp(g.player.y - b.y, -320 * dt, 320 * dt); b.squash = Math.sin(t * 30) * 0.07; b.angry = true; if (t > 0.9) { b.dstate = 1; } }
      else if (b.dstate === 1) { b.x -= speed * dt; g.particles.add({ type: 'circle', x: b.x + b.r, y: b.y + rand(-b.r, b.r), size: 8, color: puyoColor(b.color).light, life: 0.3, shrink: true }); if (b.x < -140) { b.dstate = 2; b.x = W + 160; b.y = rand(140, H - 120); } }

    },
  }),
  bounce: (dur = 4, speed = 320, n = 3) => ({
    dur, noMove: true, start(b) { b.vy = speed; },
    tick(b, dt, g) {
      b.y += b.vy * dt;
      if (b.y < 64 + b.r) { b.y = 64 + b.r; b.vy = Math.abs(b.vy); b.shootAimed(g, 220, n, 0.3); b.squash = 0.3; }
      if (b.y > H - 20 - b.r) { b.y = H - 20 - b.r; b.vy = -Math.abs(b.vy); b.shootAimed(g, 220, n, 0.3); b.squash = 0.3; }
      b.x += (b.homeX - b.x) * 2 * dt;
    },
  }),
  summon: (type, n, o = {}) => ({
    dur: 1.4, start(b, g) {
      b.squash = 0.35;
      for (let i = 0; i < n; i++) {

      g.texts.add(b.x, b.y - b.r - 30, 'おいで〜！', '#fff', 18, { pop: true });
    }, tick() {},
  }),
  formation: () => ({
    dur: 1.6, start(b, g) {
      const shape = SHAPES[pick(TETROMINO_KEYS)], color = randInt(0, 4), cy = rand(120, H - 140), phase = rand(TAU);

  crossSpiral: (dur, rate, speed, turn) => ({ dur, start(b) { b.acc = 0; b.sang = 0; }, tick(b, dt, g) { b.acc += dt; while (b.acc >= rate) { b.acc -= rate; b.sang += turn; b.shoot(g, b.sang, speed); b.shoot(g, Math.PI - b.sang, speed); } } }),

function buildPool(si) {

function generateWaves(si) {
  const st = STAGES[si], rng = mulberry32(1234 + si * 977), waves = [], pool = buildPool(si);

    const pat = weightedPick(pool, rng);

    const progress = t / st.duration; // 序盤はゆるく、終盤に向けて密度アップ

}

  // ---------- 更新 ----------
  update(dt) {

  }
  updateTitle(dt) {

    // タップ／クリック：難易度ボタンは選ぶだけ、スタートボタンで開始
    const tp = Input.tap(), U = TITLE_UI;

    if (tp) {
      for (let i = 0; i < 3; i++) if (Math.abs(tp.x - W / 2) <= U.diffW / 2 && Math.abs(tp.y - (U.diffY + i * U.diffGap)) <= U.diffH / 2 + 4) { if (this.titleCursor !== i) Sound.sfx.select(); this.titleCursor = i; }
      if (this.reached > 0 && Math.abs(tp.y - U.stageY) <= 20) {

  updateIntro(dt) {

  updatePlay(dt) {

  // ---------- 描画 ----------

    drawText(ctx, 'SCORE', 560, 10, 10, '#FFE3F0', 'center');
    drawText(ctx, String(this.score).padStart(8, '0'), 560, 26, 20, '#fff', 'center', { outline: 'rgba(0,0,0,0.4)', outlineWidth: 3 });
    drawText(ctx, `STAGE ${this.stageIndex + 1}`, 660, 21, 14, '#fff', 'center', { outline: 'rgba(0,0,0,0.5)', outlineWidth: 3 });
    // 武器パネル
    const w = p.weapon, lv = p.level, wc = w.rainbow ? rainbowColor(this.time * 3) : w.color;
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; roundRectPath(ctx, 710, 4, 246, 34, 8); ctx.fill();
    drawMino(ctx, 732, 21, w.key === 'R' ? SHAPES.T : w.shape, 6, wc, 0, 1, true);
    drawText(ctx, w.name, 758, 15, 14, '#fff', 'left', { outline: 'rgba(0,0,0,0.5)', outlineWidth: 3 });
    for (let i = 0; i < 5; i++) { ctx.fillStyle = i < lv ? wc : 'rgba(255,255,255,0.25)'; roundRectPath(ctx, 758 + i * 16, 25, 12, 7, 2); ctx.fill(); }
    drawText(ctx, lv >= 5 ? 'MAX' : `Lv${lv}`, 845, 29, 11, lv >= 5 ? '#FFE066' : '#fff', 'left');
    drawText(ctx, 'Q/E切替', 900, 29, 10, 'rgba(255,255,255,0.7)', 'left');
    // ステージ進行バー（ボスまでの距離）
    const pk = this.phase === 'waves' ? this.progress : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 42, W, 4);
    ctx.fillStyle = this.phase === 'waves' ? '#8EE5FF' : '#FF5E7A'; ctx.fillRect(0, 42, W * pk, 4);
    if (this.phase === 'waves') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W * pk, 44, 4, 0, TAU); ctx.fill(); }
    drawText(ctx, 'BOSS', W - 20, 53, 9, this.phase === 'waves' ? 'rgba(255,255,255,0.6)' : '#FF5E7A', 'right');
    // 所持武器
    const owned = WEAPONS.filter((ww) => p.weapons[ww.key]);
    owned.forEach((ww, i) => {
      const x = 724 + i * 24, y = 62, cur = ww.key === p.current;
      if (cur) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; roundRectPath(ctx, x - 11, y - 11, 22, 22, 5); ctx.fill(); }
      drawMino(ctx, x, y, ww.key === 'R' ? SHAPES.T : ww.shape, 4.2, ww.rainbow ? rainbowColor(this.time * 3) : ww.color, 0, cur ? 1 : 0.65);
      drawText(ctx, String(p.weapons[ww.key]), x + 8, y + 8, 9, '#fff', 'center', { outline: '#000', outlineWidth: 2 });
    });
    // フィーバーゲージ
    const fx = W / 2 - 150, fy = H - 16, fk = clamp(this.fever / 100, 0, 1);
    roundRectPath(ctx, fx, fy, 300, 10, 5); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    if (fk > 0) { roundRectPath(ctx, fx, fy, 300 * fk, 10, 5); ctx.fillStyle = this.feverT > 0 ? rainbowColor(this.time * 4) : '#FF5EDB'; ctx.fill(); }
    drawText(ctx, this.feverT > 0 ? `FEVER ${this.feverT.toFixed(1)}` : 'FEVER', W / 2, fy - 8, 11, '#fff', 'center', { outline: 'rgba(0,0,0,0.6)', outlineWidth: 3 });
    // 効果タイマー
    const tm = [['score', '×2', '#FFE44D'], ['rapid', 'RAPID', '#FF9F6F'], ['magnet', 'MAG', '#FF6F9F'], ['slow', 'SLOW', '#B8F0FF'], ['invincible', 'ムテキ', '#fff']];
    let tx = 14;
    for (const [k, label, col] of tm) if (p.timers[k] > 0) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; roundRectPath(ctx, tx, H - 30, 64, 20, 6); ctx.fill(); drawText(ctx, `${label} ${Math.ceil(p.timers[k])}`, tx + 32, H - 20, 11, col); tx += 70; }
    if (p.speedLv > 1 || p.rear || p.missiles || p.wide || p.chainBonus) {
      const eq = []; if (p.speedLv > 1) eq.push(`SPD${p.speedLv}`); if (p.rear) eq.push('REAR'); if (p.missiles) eq.push('MSL'); if (p.wide) eq.push(`WIDE${p.wide}`); if (p.chainBonus) eq.push(`CHAIN+${p.chainBonus}`);
      drawText(ctx, eq.join('  '), 14, H - 42, 11, 'rgba(255,255,255,0.85)', 'left', { outline: 'rgba(0,0,0,0.5)', outlineWidth: 3 });
    }
    // ボス HP
    if ((this.phase === 'boss' || this.phase === 'bossDie') && this.bosses.length) {
      let hp = 0, max = 0; for (const b of this.bosses) { hp += Math.max(0, b.hp); max += b.maxHp; }
      const bx = 180, bw = W - 360, k = clamp(hp / max, 0, 1);
      roundRectPath(ctx, bx, 54, bw, 12, 6); ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fill();
      if (k > 0) { roundRectPath(ctx, bx, 54, Math.max(6, bw * k), 12, 6); ctx.fillStyle = k > 0.5 ? '#FF5E7A' : '#FF2D55'; ctx.fill(); }
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; roundRectPath(ctx, bx, 54, bw, 12, 6); ctx.stroke();
      const b0 = this.bosses[0];
      drawText(ctx, `${b0.name}  ${b0.bdef.en}`, W / 2, 76, 13, '#fff', 'center', { outline: 'rgba(0,0,0,0.6)', outlineWidth: 3 });
      if (b0.armorMax > 0 && b0.armorHp > 0) { roundRectPath(ctx, bx, 68, bw * (b0.armorHp / b0.armorMax), 4, 2); ctx.fillStyle = '#FFD27A'; ctx.fill(); }
    }
  }
  drawFeverBorder(ctx) {
    ctx.save(); ctx.lineWidth = 14; ctx.strokeStyle = rainbowColor(this.time * 4); ctx.globalAlpha = 0.45 + Math.sin(this.time * 10) * 0.2; ctx.strokeRect(0, 0, W, H); ctx.restore();
  }
  drawChain(ctx) {
    const n = this.chainCount, k = 1 - this.chainShowT / 1.4;
    const sc = k < 0.15 ? easeOutBack(k / 0.15) : 1, alpha = k > 0.75 ? 1 - (k - 0.75) / 0.25 : 1;
    const x = W * 0.62, y = 150;
    const col = n >= 7 ? rainbowColor(this.time * 5) : n >= 4 ? '#FFE066' : '#fff';
    drawText(ctx, `${n}`, x - 40, y, 72 * sc, col, 'center', { outline: '#5A2A9A', outlineWidth: 10, alpha });
    drawText(ctx, 'れんさ！', x + 50, y + 10, 34 * sc, col, 'center', { outline: '#5A2A9A', outlineWidth: 8, alpha });
    const word = CHAIN_WORDS.find(([m]) => n >= m)[1];
    if (word) drawText(ctx, word, x, y + 56, 26 * sc, '#FF8FB0', 'center', { outline: '#5A2A9A', outlineWidth: 6, alpha });
  }
  drawWarning(ctx) {
    const t = this.phaseT, a = 0.5 + Math.sin(t * 12) * 0.5;
    ctx.fillStyle = `rgba(255,40,80,${0.18 * a})`; ctx.fillRect(0, H / 2 - 70, W, 140);
    ctx.fillStyle = 'rgba(60,0,20,0.75)'; ctx.fillRect(0, H / 2 - 50, W, 100);
    drawText(ctx, 'WARNING!!', W / 2, H / 2 - 12, 54, `rgba(255,80,110,${0.6 + a * 0.4})`, 'center', { outline: '#fff', outlineWidth: 4 });
    drawText(ctx, `${BOSS_DEFS[this.stageIndex].name} があらわれた！`, W / 2, H / 2 + 32, 20, '#fff');
    ctx.fillStyle = 'rgba(255,80,110,0.8)'; const off = (t * 300) % 80; for (let x = -80 + off; x < W; x += 80) { ctx.fillRect(x, H / 2 - 54, 40, 4); ctx.fillRect(x + 40, H / 2 + 50, 40, 4); }
  }
  drawBomb(ctx) {
    const t = this.bombT, rows = 13, cols = 24, cs = 40;
    if (!this.bombGrid) return;
    if (t < 0.55) {
      const filled = Math.floor(easeOut(t / 0.55) * rows);
      for (let r = 0; r < filled; r++) for (let c = 0; c < cols; c++) drawMino(ctx, c * cs + cs / 2, H - r * cs - cs / 2, SHAPES.M, cs, this.bombGrid[r][c], 0, 0.92);
    } else {
      const k = clamp((t - 0.55) / 0.6, 0, 1), size = cs * (1 - k);
      if (size > 1) for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) drawMino(ctx, c * cs + cs / 2, H - r * cs - cs / 2, SHAPES.M, size, this.bombGrid[r][c], k * 3, 1 - k);
    }
  }
  drawIntro(ctx) {
    const t = this.stateT, st = STAGES[this.stageIndex];
    const k = t < 0.5 ? easeOut(t / 0.5) : t > 2.3 ? 1 - easeIn((t - 2.3) / 0.5) : 1;
    ctx.fillStyle = 'rgba(15,5,40,0.85)'; ctx.fillRect(0, 0, W, 80 * k); ctx.fillRect(0, H - 80 * k, W, 80 * k);
    ctx.save(); ctx.globalAlpha = clamp(k, 0, 1);
    ctx.fillStyle = 'rgba(15,5,40,0.55)'; roundRectPath(ctx, W / 2 - 300, H / 2 - 70, 600, 140, 20); ctx.fill();
    drawText(ctx, `STAGE ${this.stageIndex + 1}`, W / 2, H / 2 - 36, 30, '#FFE066', 'center', { outline: '#5A2A9A', outlineWidth: 6 });
    drawText(ctx, st.name, W / 2, H / 2 + 6, 44, '#fff', 'center', { outline: '#5A2A9A', outlineWidth: 8 });
    drawText(ctx, `${st.en}  —  ${st.sub}`, W / 2, H / 2 + 46, 18, '#FFE3F0', 'center', { outline: '#5A2A9A', outlineWidth: 4 });
    ctx.restore();
  }
  drawClear(ctx) {
    const t = this.stateT, k = Math.min(1, t / 0.6);
    ctx.fillStyle = `rgba(15,5,40,${0.55 * k})`; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = k;
    drawText(ctx, 'STAGE CLEAR!', W / 2, 120, 64 * easeOutBack(k), '#FFE066', 'center', { outline: '#5A2A9A', outlineWidth: 10 });
    const rows = [['スコア', String(this.score).padStart(8, '0')], ['最大れんさ', `${this.stageMaxChain} れんさ`], ['ポップしたぷよ', `${this.stagePop}`], ['クリアボーナス', `+${this.clearBonus}`], [this.stageDeaths === 0 ? 'ノーミス！' : 'ミス', this.stageDeaths === 0 ? '+5000' : `${this.stageDeaths} 回`]];
    rows.forEach(([a, b], i) => { if (t < 0.8 + i * 0.25) return; drawText(ctx, a, W / 2 - 40, 200 + i * 40, 22, '#FFE3F0', 'right', { outline: '#5A2A9A', outlineWidth: 5 }); drawText(ctx, b, W / 2 + 40, 200 + i * 40, 24, '#fff', 'left', { outline: '#5A2A9A', outlineWidth: 5 }); });
    if (t > 2.5) drawText(ctx, this.stageIndex < STAGES.length - 1 ? 'つぎのステージへ (Z)' : 'さいごのけっか (Z)', W / 2, 440, 20, `rgba(255,255,255,${0.6 + Math.sin(t * 6) * 0.4})`, 'center');
    ctx.restore();
  }
  drawGameOver(ctx) {
    const t = this.stateT, k = Math.min(1, t / 0.8);
    ctx.fillStyle = `rgba(20,0,30,${0.7 * k})`; ctx.fillRect(0, 0, W, H);
    drawText(ctx, 'GAME OVER', W / 2, 170, 70 * easeOutBack(k), '#FF5E7A', 'center', { outline: '#2A0A2A', outlineWidth: 12 });
    drawText(ctx, `SCORE ${String(this.score).padStart(8, '0')}`, W / 2, 250, 26, '#fff', 'center', { outline: '#2A0A2A', outlineWidth: 5 });
    drawText(ctx, `HI SCORE ${String(this.hi).padStart(8, '0')}`, W / 2, 285, 18, '#FFE066', 'center', { outline: '#2A0A2A', outlineWidth: 4 });
    drawText(ctx, `最大れんさ ${this.maxChain}   ポップ ${this.popCount}`, W / 2, 318, 18, '#FFE3F0', 'center', { outline: '#2A0A2A', outlineWidth: 4 });
    if (t > 1.2) { drawText(ctx, `Z / ENTER : STAGE ${this.stageIndex + 1} からリトライ`, W / 2, 390, 22, '#fff', 'center', { outline: '#2A0A2A', outlineWidth: 5 }); drawText(ctx, 'X / ESC : タイトルへ', W / 2, 425, 18, 'rgba(255,255,255,0.8)', 'center', { outline: '#2A0A2A', outlineWidth: 4 }); }
  }
  drawTitle(ctx) {
    BG.draw(ctx, this, 0);
    ctx.fillStyle = 'rgba(30,10,60,0.35)'; ctx.fillRect(0, 0, W, H);
    for (const p of this.titlePuyos) drawPuyo(ctx, p.x, p.y, p.r, puyoColor(p.c), { t: this.time, phase: p.ph, eyeDir: { x: Math.sin(this.time + p.ph), y: 0 } });
    this.particles.draw(ctx);
    const letters = 'TETORISU'.split(''), cols = ['I', 'O', 'T', 'S', 'Z', 'J', 'L', 'M'];
    const x0 = W / 2 - (letters.length * 82) / 2 + 41;
    letters.forEach((ch, i) => {
      const y = 130 + Math.sin(this.time * 3 + i * 0.6) * 10;
      drawMino(ctx, x0 + i * 82, y - 62, SHAPES[cols[i] === 'M' ? 'T' : cols[i]], 9, MINO_COLORS[cols[i]], Math.sin(this.time + i) * 0.2);
      drawText(ctx, ch, x0 + i * 82, y, 96, MINO_COLORS[cols[i]], 'center', { outline: '#2A1838', outlineWidth: 14, shadow: 'rgba(0,0,0,0.35)' });
    });
    drawText(ctx, 'テトリス × ぷよぷよ × 横スクロールシューティング', W / 2, 210, 22, '#fff', 'center', { outline: '#2A1838', outlineWidth: 6 });
    drawText(ctx, 'テトロミノでぷよを打ち抜け！　同じ色をまとめてポップさせて大れんさ！', W / 2, 242, 17, '#FFE3F0', 'center', { outline: '#2A1838', outlineWidth: 5 });
    drawText(ctx, `全 ${STAGES.length} ステージ　武器 ${WEAPONS.length} 種　ボス ${BOSS_DEFS.length} 体`, W / 2, 268, 13, 'rgba(255,255,255,0.8)', 'center', { outline: '#2A1838', outlineWidth: 4 });
    // 難易度ボタン（タップで選択）
    const U = TITLE_UI;
    drawText(ctx, 'なんいど（タップで えらぶ）', W / 2, U.diffY - 27, 13, 'rgba(255,255,255,0.85)', 'center', { outline: '#2A1838', outlineWidth: 4 });
    DIFFS.forEach((d, i) => {
      const y = U.diffY + i * U.diffGap, sel = i === this.titleCursor;
      roundRectPath(ctx, W / 2 - U.diffW / 2, y - U.diffH / 2, U.diffW, U.diffH, 17);
      ctx.fillStyle = sel ? d.color : 'rgba(255,255,255,0.22)'; ctx.fill();
      ctx.lineWidth = sel ? 4 : 2; ctx.strokeStyle = sel ? '#fff' : 'rgba(255,255,255,0.6)'; ctx.stroke();
      if (sel) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(W / 2 - U.diffW / 2 + 20, y, 7, 0, TAU); ctx.fill(); ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(W / 2 - U.diffW / 2 + 20, y, 3.5, 0, TAU); ctx.fill(); }
      drawText(ctx, d.name, W / 2, y + 1, sel ? 22 : 19, '#fff', 'center', { outline: sel ? 'rgba(0,0,0,0.35)' : '#2A1838', outlineWidth: sel ? 3 : 5 });
    });
    const desc = ['残機5・敵ゆっくり。はじめての人に。', '残機3。バランスのよい難しさ。', '残機2・敵つよめ。れんさ上級者向け。'][this.titleCursor];
    drawText(ctx, desc, W / 2, U.diffY + 3 * U.diffGap - 10, 14, 'rgba(255,255,255,0.9)', 'center', { outline: '#2A1838', outlineWidth: 4 });
    if (this.reached > 0) { // 開始ステージ（◀ ▶ をタップ）
      const ss = STAGES[this.startStageSel];
      for (const sgn of [-1, 1]) { ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.arc(W / 2 + sgn * 205, U.stageY, 17, 0, TAU); ctx.fill(); drawText(ctx, sgn < 0 ? '◀' : '▶', W / 2 + sgn * 205, U.stageY + 1, 16, '#fff'); }
      drawText(ctx, `STAGE ${this.startStageSel + 1} ${ss.name} から`, W / 2, U.stageY, 15, '#FFE066', 'center', { outline: '#2A1838', outlineWidth: 4 });
    }
    // スタートボタン
    const pulse = 0.5 + Math.sin(this.time * 5) * 0.5;
    roundRectPath(ctx, W / 2 - U.startW / 2, U.startY - U.startH / 2, U.startW, U.startH, 22);
    ctx.fillStyle = `rgba(255,${120 + pulse * 60},${170 + pulse * 40},0.95)`; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
    drawText(ctx, 'スタート！', W / 2, U.startY + 1, 24, '#fff', 'center', { outline: 'rgba(90,30,70,0.6)', outlineWidth: 4 });
    const isTouch = Input.touch.enabled || (navigator.maxTouchPoints || 0) > 0; // スマホではキーボードの説明を出さない
    if (!isTouch) {
      drawText(ctx, 'Z / ENTER: スタート　移動: ↑↓←→ / WASD　ショット: Z　ボム: X　チャージ: C(長押し)　武器切替: Q / E　ポーズ: P　ミュート: M', W / 2, 520, 11, '#fff', 'center', { outline: '#2A1838', outlineWidth: 4 });
      drawText(ctx, 'ゲームパッド・タッチ操作にも対応', W / 2, 533, 10, 'rgba(255,255,255,0.75)', 'center', { outline: '#2A1838', outlineWidth: 3 });
    }
    drawText(ctx, `HI SCORE ${String(this.hi).padStart(8, '0')}`, W - 16, 20, 16, '#FFE066', 'right', { outline: '#2A1838', outlineWidth: 4 });
    if (Sound.isMuted()) drawText(ctx, 'MUTE', 16, 20, 14, '#fff', 'left', { outline: '#2A1838', outlineWidth: 4 });
  }
  drawEnding(ctx) {
    BG.draw(ctx, this, STAGES.length - 1);
    ctx.fillStyle = 'rgba(10,0,30,0.45)'; ctx.fillRect(0, 0, W, H);
    for (const p of this.titlePuyos) drawPuyo(ctx, p.x, p.y, p.r, puyoColor(p.c), { t: this.time, phase: p.ph, eyeDir: { x: 0, y: -0.5 } });
    this.particles.draw(ctx);
    const t = this.stateT, k = Math.min(1, t / 0.8);
    drawText(ctx, 'ALL CLEAR!!', W / 2, 110, 76 * easeOutBack(k), rainbowColor(this.time * 2), 'center', { outline: '#2A1838', outlineWidth: 14 });
    drawText(ctx, 'テトロディメンションに平和がもどった！', W / 2, 175, 24, '#fff', 'center', { outline: '#2A1838', outlineWidth: 6 });
    drawText(ctx, 'ぷよたちもテトロミノもみんななかよし。あそんでくれてありがとう！', W / 2, 208, 17, '#FFE3F0', 'center', { outline: '#2A1838', outlineWidth: 5 });
    const rows = [['FINAL SCORE', String(this.score).padStart(8, '0')], ['HI SCORE', String(this.hi).padStart(8, '0')], ['最大れんさ', `${this.maxChain} れんさ`], ['ポップしたぷよ', `${this.popCount}`], ['なんいど', DIFFS[this.diffIndex].name]];
    rows.forEach(([a, b], i) => { if (t < 1 + i * 0.3) return; drawText(ctx, a, W / 2 - 30, 265 + i * 36, 20, '#FFE3F0', 'right', { outline: '#2A1838', outlineWidth: 5 }); drawText(ctx, b, W / 2 + 30, 265 + i * 36, 24, '#fff', 'left', { outline: '#2A1838', outlineWidth: 5 }); });
    // パレード
    const px = ((t * 120) % (W + 300)) - 150;
    this.player.x = px; this.player.y = 470 + Math.sin(t * 3) * 10; this.player.alive = true; this.player.inv = 0; this.player.draw(ctx);
    for (let i = 0; i < 5; i++) drawPuyo(ctx, px - 70 - i * 50, 470 + Math.sin(t * 6 + i) * 12, 18, puyoColor(i), { t: this.time + i, eyeDir: { x: 1, y: 0 } });
    if (t > 3) drawText(ctx, 'Z / ENTER でタイトルへ', W / 2, 520, 18, `rgba(255,255,255,${0.6 + Math.sin(t * 5) * 0.4})`, 'center', { outline: '#2A1838', outlineWidth: 4 });
  }
}

/* ---- js/main.js ---- */
'use strict';
// ===== 起動 =====
window.addEventListener('load', () => {
  const canvas = document.getElementById('game');
  Input.init(canvas);
  const game = new Game(canvas);
  window.game = game;
  function resize() {
    const vv = window.visualViewport;
    const vw = vv ? vv.width : window.innerWidth, vh = vv ? vv.height : window.innerHeight;
    const s = Math.min(vw / W, vh / H);
    canvas.style.width = `${Math.floor(W * s)}px`; canvas.style.height = `${Math.floor(H * s)}px`;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();
  // 全画面（ボタン / F キー）。横向きに固定できる端末では固定する
  const fsBtn = document.getElementById('fs');
  const fsEl = document.documentElement;
  const canFullscreen = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
  async function toggleFullscreen() {
    try {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (fsEl.requestFullscreen) await fsEl.requestFullscreen({ navigationUI: 'hide' }); else if (fsEl.webkitRequestFullscreen) fsEl.webkitRequestFullscreen();
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
      } else if (document.exitFullscreen) await document.exitFullscreen();
    } catch (e) { /* 全画面が許可されない環境 */ }
    setTimeout(resize, 100);
  }
  if (canFullscreen) {
    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => { fsBtn.classList.toggle('hidden', !!document.fullscreenElement); resize(); });
    window.addEventListener('keydown', (e) => { if (e.code === 'KeyF') toggleFullscreen(); });
  } else fsBtn.classList.add('hidden');
  const unlock = () => { if (Sound.ensure()) { Sound.resume(); if (game.state === 'title') Sound.play('title'); } };
  window.addEventListener('keydown', unlock); window.addEventListener('pointerdown', unlock);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
    game.update(dt); game.draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // ホーム画面に追加したときにオフラインでも起動できるようにする（file:// では登録しない）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* 無視 */ }
  }
});
