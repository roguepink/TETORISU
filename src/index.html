<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0c0618">
  <title>TETORISU - テトリス×ぷよぷよ 横スクロールシューティング</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3c7 0 12 5.5 12 12.5C28 22 23 28 16 28S4 22 4 15.5C4 8.5 9 3 16 3z' fill='%23ff5e7a' stroke='%23c83050' stroke-width='1.5'/%3E%3Cellipse cx='11' cy='9' rx='3' ry='2' fill='%23fff' opacity='.6'/%3E%3Ccircle cx='11.5' cy='15' r='3.4' fill='%23fff'/%3E%3Ccircle cx='20.5' cy='15' r='3.4' fill='%23fff'/%3E%3Ccircle cx='12.2' cy='15.4' r='1.7' fill='%232a1838'/%3E%3Ccircle cx='21.2' cy='15.4' r='1.7' fill='%232a1838'/%3E%3Cpath d='M13 21q3 2.5 6 0' stroke='%23c83050' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <button id="fs" type="button" title="全画面 (F)">⛶ 全画面</button>
    <div id="rotate">📱 横向きにすると画面いっぱいで遊べます</div>
    <!-- iPhone だけに出す「ホーム画面に追加」の案内（iPhone の Safari はページを全画面にできないため） -->
    <div id="iosGuide" class="hidden" role="dialog" aria-label="ホーム画面に追加すると全画面で遊べます">
      <div class="ig-card">
        <div class="ig-eyebrow">iPhone の かたへ</div>
        <div class="ig-title">ホーム画面に追加すると<br>全画面で あそべます！</div>
        <div class="ig-steps">
          <div class="ig-step"><div class="ig-num">1</div>
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="9" width="14" height="12" rx="2" fill="none" stroke="#2a7ad0" stroke-width="2"/><path d="M12 3v11M8 7l4-4 4 4" fill="none" stroke="#2a7ad0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <div class="ig-tx">Safari の<br><b>共有ボタン</b>を<br>おす</div></div>
          <div class="ig-ar">▶</div>
          <div class="ig-step"><div class="ig-num">2</div>
            <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="#2a1838" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="#2a1838" stroke-width="2" stroke-linecap="round"/></svg>
            <div class="ig-tx"><b>「ホーム画面に<br>追加」</b>を<br>えらぶ</div></div>
          <div class="ig-ar">▶</div>
          <div class="ig-step"><div class="ig-num">3</div>
            <canvas id="igIcon" width="68" height="68" aria-hidden="true"></canvas>
            <div class="ig-tx">ホーム画面の<br><b>アイコン</b>から<br>ひらく</div></div>
        </div>
        <button id="igClose" type="button">このまま あそぶ</button>
        <label class="ig-check"><input id="igNever" type="checkbox"> 次から 表示しない</label>
      </div>
    </div>
  </div>
  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/items.js"></script>
  <script src="js/enemies.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
